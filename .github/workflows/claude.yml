name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # @claude メンションに加えて、コメント対象の Issue/PR 自体の作成者が
    # OWNER/MEMBER/COLLABORATOR でない場合は起動しない。トリガーした人物の検証
    # （claude-code-action 既定の write 権限チェック）だけでなく、エージェントが
    # 読み書き対象とする内容の出どころも検証し、第三者が Issue/PR 本文に埋め込んだ
    # 指示文（プロンプトインジェクション）を書き込み権限を持つエージェントに
    # 読ませないための防御。
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) &&
      contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.pull_request.author_association || github.event.issue.author_association
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for Claude to push the working branch
      pull-requests: write # Required for Claude to open a PR
      issues: write # Required for Claude to update its progress comment
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Reject fork-originated PRs (pwn request guard)
        # トリガー条件は「誰が起動したか・対象の作成者は誰か」しか保証しない。
        # コメント対象の PR がフォーク（別リポジトリ）由来の場合、そのブランチ内容は
        # 攻撃者制御下にあり得るため、secrets と contents:write 等の権限を持つ
        # claude step を実行させない。
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          number=""
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # PR ではない通常の issue コメントならフォーク由来のブランチは無関係
            if [ -n "$ISSUE_PR_URL" ]; then
              number="$ISSUE_NUMBER"
            fi
          else
            # issues イベントでは REVIEW_PR_NUMBER が空 → is_fork=false になる
            number="$REVIEW_PR_NUMBER"
          fi

          if [ -z "$number" ]; then
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_fork=$(gh pr view "$number" --json isCrossRepository --jq .isCrossRepository)
          echo "is_fork=$is_fork" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        if: steps.guard.outputs.is_fork != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # Let Claude run the verification commands before pushing.
          # These are merged into tag mode's built-in tools, not a replacement for them.
          #
          # Each command is allowlisted exactly. Avoid a wildcard such as `Bash(pnpm:*)`:
          # it would also permit `pnpm exec` / `pnpm dlx` / `pnpm run <any script>`,
          # which is arbitrary code execution under a `contents: write` token.
          # Adjust the commands to match the project (npm / yarn / cargo / go ...).
          claude_args: '--allowed-tools "Bash(pnpm lint)" "Bash(pnpm typecheck)" "Bash(pnpm test)"'

      - name: Open Draft PR for Claude branch
        # Claude Code Action が変更を push したら、その作業ブランチに対して
        # 自動で Draft PR を立てる。マージ判断は owner が行う前提。
        # branch_name は信頼値だが env 経由で渡し shell では引用展開する（command injection 防御）。
        if: success() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            echo "PR already exists for $BRANCH (#$existing)"
            exit 0
          fi
          gh pr create --draft \
            --head "$BRANCH" \
            --base "$BASE" \
            --fill

